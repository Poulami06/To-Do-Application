<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo Application using JavaScript</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
</head>
<body class="bg-color">
    <div class="card text-center shadow" style="max-width: 500px; margin: 50px auto">
        <div class="card-header">
            My Mini Task App
        </div>
        <div class="card-body">
            <h4 class="card-title">Write your thought what is your next work</h4>

            <!-- Input & Button Group -->
            <input
  type="text"
  id="taskInput"
  placeholder="Write something ..."
   />
   <button type="button" id="addTaskBtn" class="btn-outline theme-success  mx-auto">Add Task</button>
        </div>

        <!-- Task List Area -->
         <ul class="list-group list-group-flush text-start" id="taskList">
            <!-- Add this using JS -->
      </ul>
        </div>

    

  <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>
